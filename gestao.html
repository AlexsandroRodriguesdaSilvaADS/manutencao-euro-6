<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARS Sistem — Sistema de Gestão de Oficina Mecânica</title>
    <!-- Tailwind CSS via CDN para estilização responsiva e moderna -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome para ícones automotivos e de interface -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fonte Inter para máxima legibilidade -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        slate: {
                            850: '#172033',
                            900: '#0f172a',
                            950: '#090d16',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Estilos personalizados e regras críticas de impressão */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
        }

        /* Scrollbar discreta */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Oculta área de impressão na visualização normal de tela */
        #print-container {
            display: none;
        }

        /* Regras @media print para emissão limpa de OS e Comprovante de Check-out em folha A4 */
        @media print {
            @page {
                size: A4 portrait;
                margin: 12mm;
            }

            body {
                background-color: #ffffff !important;
                color: #000000 !important;
                margin: 0;
                padding: 0;
            }

            /* Oculta toda a interface web */
            #app-shell,
            #modal-backdrop,
            #toast-container {
                display: none !important;
            }

            /* Exibe apenas o documento formatado para impressão */
            #print-container {
                display: block !important;
                width: 100%;
                background: #ffffff;
                font-size: 11pt;
                line-height: 1.4;
            }

            .print-box {
                border: 1px solid #334155;
                border-radius: 4px;
                padding: 8px 10px;
                margin-bottom: 10px;
            }

            .print-table {
                width: 100%;
                border-collapse: collapse;
                margin-bottom: 10px;
            }

            .print-table th,
            .print-table td {
                border: 1px solid #cbd5e1;
                padding: 5px 8px;
                text-align: left;
                font-size: 9.5pt;
            }

            .print-table th {
                background-color: #f1f5f9 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                font-weight: 700;
            }
        }
    </style>
</head>

<body class="text-slate-800 antialiased selection:bg-blue-600 selection:text-white">

    <!-- LÓGICA COMPLETA DO SISTEMA EM JAVASCRIPT PURO                         -->
    <!-- ===================================================================== -->
    <script>
        /**
         * ARQUITETURA DE DADOS E PERSISTÊNCIA (localStorage)
         */
        const STORAGE_KEY = 'autotech_oficina_db_v1';

        // Estado global da aplicação
        let db = {
            workshop: {
                name: 'AUTOTECH CENTRO AUTOMOTIVO LTDA',
                cnpj: '12.345.678/0001-99',
                phone: '(11) 98765-4321',
                address: 'Av. das Engrenagens, 1500 - Distrito Industrial - São Paulo/SP',
                email: 'contato@autotechoficina.com.br'
            },
            lastOsNumber: 0,
            clients: [],   // { id, name, document, phone, email, createdAt }
            vehicles: [],  // { id, clientId, plate, brandModel, year, engine, color }
            orders: []     // Fluxo completo: 'DIAGNOSTICO' | 'OS' | 'CHECKOUT' | 'CONCLUIDO'
        };

        let currentTab = 'patio';
        let searchQuery = '';

        /**
         * Inicializa o banco de dados a partir do localStorage
         */
        function loadDatabase() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    db = { ...db, ...parsed };
                } else {
                    // Popula automaticamente dados de demonstração na primeira abertura para facilitar avaliação imediata
                    seedDemoData(false);
                }
            } catch (err) {
                console.error('Erro ao carregar localStorage:', err);
                showToast('Erro ao ler dados locais. Iniciando base limpa.', 'error');
            }
            updateHeaderWorkshop();
        }

        /**
         * Salva todo o estado no localStorage
         */
        function saveDatabase() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
                refreshUI();
            } catch (err) {
                console.error('Erro ao salvar no localStorage:', err);
                showToast('Falha ao salvar dados no navegador!', 'error');
            }
        }

        function updateHeaderWorkshop() {
            const el = document.getElementById('header-workshop-name');
            if (el) el.textContent = db.workshop.name;
        }

        /**
         * Utilitários de Formatação e Geração de IDs
         */
        function generateId(prefix = 'id') {
            return `${prefix}_${Date.now()}_${Math.random().toString(36).substring(2, 7)}`;
        }

        function formatCurrency(val) {
            const num = parseFloat(val) || 0;
            return num.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function formatDateTime(isoStr) {
            if (!isoStr) return '-';
            const d = new Date(isoStr);
            return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        }

        function formatOsNumber(num) {
            return String(num).padStart(4, '0');
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        /**
         * Sistema de Notificações Toast (Sem uso de alert)
         */
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');

            const styles = {
                success: 'bg-slate-900 border-emerald-500 text-white',
                error: 'bg-red-950 border-red-500 text-white',
                info: 'bg-slate-900 border-blue-500 text-white',
                warning: 'bg-amber-950 border-amber-500 text-white'
            };
            const icons = {
                success: 'fa-circle-check text-emerald-400',
                error: 'fa-circle-exclamation text-red-400',
                info: 'fa-circle-info text-blue-400',
                warning: 'fa-triangle-exclamation text-amber-400'
            };

            toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl shadow-xl border-l-4 ${styles[type] || styles.info} transform transition-all duration-300 translate-y-2 opacity-0`;
            toast.innerHTML = `
                <i class="fa-solid ${icons[type] || icons.info} text-base"></i>
                <span class="text-xs sm:text-sm font-medium flex-1">${escapeHtml(message)}</span>
            `;

            container.appendChild(toast);
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        /**
         * Controle de Modais
         */
        function openModal({ title, icon = 'fa-wrench', bodyHtml, footerHtml, maxWidth = 'max-w-4xl' }) {
            const backdrop = document.getElementById('modal-backdrop');
            const box = document.getElementById('modal-box');
            box.className = `bg-white rounded-2xl shadow-2xl border border-slate-200 w-full ${maxWidth} max-h-[92vh] flex flex-col overflow-hidden my-auto`;

            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-icon').className = `fa-solid ${icon} text-blue-400 text-lg`;
            document.getElementById('modal-body').innerHTML = bodyHtml;
            document.getElementById('modal-footer').innerHTML = footerHtml || '';

            backdrop.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal-backdrop').classList.add('hidden');
        }

        /**
         * Cálculos Financeiros da Ordem de Serviço
         */
        function calculateOrderTotals(order) {
            const parts = order.parts || [];
            const services = order.services || [];

            const partsTotal = parts.reduce((acc, item) => acc + ((parseFloat(item.qty) || 0) * (parseFloat(item.unitPrice) || 0)), 0);
            const servicesTotal = services.reduce((acc, item) => acc + ((parseFloat(item.qty) || 0) * (parseFloat(item.unitPrice) || 0)), 0);
            const subtotal = partsTotal + servicesTotal;

            const discountVal = parseFloat(order.discountValue) || 0;
            const discountType = order.discountType || 'R$'; // 'R$' ou '%'
            let discountAmount = 0;

            if (discountType === '%') {
                discountAmount = subtotal * (Math.min(discountVal, 100) / 100);
            } else {
                discountAmount = Math.min(discountVal, subtotal);
            }

            const grandTotal = Math.max(0, subtotal - discountAmount);

            return {
                partsTotal,
                servicesTotal,
                subtotal,
                discountAmount,
                grandTotal
            };
        }

        /**
         * Navegação e Filtro Global
         */
        function switchTab(tabName) {
            currentTab = tabName;
            refreshUI();
        }

        function handleGlobalSearch(val) {
            searchQuery = val.trim().toLowerCase();
            const clearBtn = document.getElementById('clear-search-btn');
            if (searchQuery) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }
            refreshUI();
        }

        function clearGlobalSearch() {
            const input = document.getElementById('global-search');
            input.value = '';
            handleGlobalSearch('');
        }

        function filterOrdersBySearch(ordersList) {
            if (!searchQuery) return ordersList;
            return ordersList.filter(o => {
                const client = db.clients.find(c => c.id === o.clientId) || {};
                const vehicle = db.vehicles.find(v => v.id === o.vehicleId) || {};
                const osNumStr = formatOsNumber(o.osNumber);

                return (
                    osNumStr.includes(searchQuery) ||
                    (vehicle.plate && vehicle.plate.toLowerCase().includes(searchQuery)) ||
                    (vehicle.brandModel && vehicle.brandModel.toLowerCase().includes(searchQuery)) ||
                    (client.name && client.name.toLowerCase().includes(searchQuery)) ||
                    (client.document && client.document.toLowerCase().includes(searchQuery))
                );
            });
        }

        /**
         * Atualização Geral da Interface (KPIs, Badges e Aba Ativa)
         */
        function refreshUI() {
            // Contadores
            const inDiag = db.orders.filter(o => o.stage === 'DIAGNOSTICO');
            const inOs = db.orders.filter(o => o.stage === 'OS');
            const inCheckout = db.orders.filter(o => o.stage === 'CHECKOUT');
            const completed = db.orders.filter(o => o.stage === 'CONCLUIDO');
            const inYard = db.orders.filter(o => o.stage !== 'CONCLUIDO');

            const totalRevenue = completed.reduce((acc, o) => acc + calculateOrderTotals(o).grandTotal, 0);

            // Atualiza KPIs
            document.getElementById('kpi-patio').textContent = inYard.length;
            document.getElementById('kpi-diagnostico').textContent = inDiag.length;
            document.getElementById('kpi-os').textContent = inOs.length;
            document.getElementById('kpi-faturamento').textContent = formatCurrency(totalRevenue);

            // Atualiza Badges das Abas
            document.getElementById('badge-patio').textContent = inYard.length;
            document.getElementById('badge-diagnostico').textContent = inDiag.length;
            document.getElementById('badge-os').textContent = inOs.length;
            document.getElementById('badge-checkout').textContent = inCheckout.length;

            // Atualiza Estilização das Abas
            document.querySelectorAll('.tab-btn').forEach(btn => {
                const isActive = btn.dataset.tab === currentTab;
                if (isActive) {
                    btn.className = 'tab-btn flex-1 min-w-[130px] py-2.5 px-3 rounded-xl text-xs sm:text-sm font-bold flex items-center justify-center gap-2 transition bg-slate-900 text-white shadow';
                } else {
                    btn.className = 'tab-btn flex-1 min-w-[130px] py-2.5 px-3 rounded-xl text-xs sm:text-sm font-semibold flex items-center justify-center gap-2 transition text-slate-600 hover:bg-slate-100';
                }
            });

            // Renderiza conteúdo da aba atual
            const area = document.getElementById('main-content-area');
            switch (currentTab) {
                case 'patio':
                    area.innerHTML = renderPatioKanbanView();
                    break;
                case 'diagnostico':
                    area.innerHTML = renderStageListView('DIAGNOSTICO', 'Etapa 2: Diagnóstico Técnico', 'Veículos aguardando inspeção de scanner, testes mecânicos e parecer técnico.');
                    break;
                case 'os':
                    area.innerHTML = renderStageListView('OS', 'Etapa 3: Ordem de Serviço & Execução', 'Orçamentos, aprovação do cliente, lançamento de peças/mão de obra e execução em box.');
                    break;
                case 'checkout':
                    area.innerHTML = renderStageListView('CHECKOUT', 'Etapa 4: Check-out, Entrega & Faturamento', 'Serviços concluídos prontos para conferência final, garantia e recebimento.');
                    break;
                case 'historico':
                    area.innerHTML = renderHistoryView();
                    break;
                case 'database':
                    area.innerHTML = renderDatabaseView();
                    break;
            }
        }

         */

                    <!-- Coluna 2: Ordem de Serviço -->

        // Card individual de veículo/OS

        // 6. Banco de Dados de Clientes, Veículos & Backup JSON

            const filteredClients = db.clients.filter(c => {
                if (!searchQuery) return true;
                const clientVehicles = db.vehicles.filter(v => v.clientId === c.id);
                const plateMatch = clientVehicles.some(v => v.plate.toLowerCase().includes(searchQuery) || v.brandModel.toLowerCase().includes(searchQuery));
                return (
                    c.name.toLowerCase().includes(searchQuery) ||
                    (c.document && c.document.toLowerCase().includes(searchQuery)) ||
                    (c.phone && c.phone.toLowerCase().includes(searchQuery)) ||
                    plateMatch

            return `

                                <tr class="border-b border-slate-200 text-[11px] font-bold uppercase tracking-wider text-slate-500 bg-slate-50/50">

                                    <th class="py-3 px-4">CPF / CNPJ</th>

        /**
         * =====================================================================
         * ETAPA 1: MODAL DE CHECK-IN (RECEPÇÃO)
         * =====================================================================
         */
        function openCheckinModal(preselectedClientId = '') {
            const clientOptions = db.clients.map(c =>
                `<option value="${c.id}" ${c.id === preselectedClientId ? 'selected' : ''}>${escapeHtml(c.name)} (${escapeHtml(c.document || c.phone || 'S/Doc')})</option>`
            ).join('');

        function toggleCheckinClientMode() {
            const mode = document.querySelector('input[name="clientMode"]:checked').value;
            const existingBox = document.getElementById('checkin-existing-client-box');
            const newBox = document.getElementById('checkin-new-client-box');

            if (mode === 'existing') {
                existingBox.classList.remove('hidden');
                newBox.classList.add('hidden');
            } else {
                existingBox.classList.add('hidden');
                newBox.classList.remove('hidden');
                // Se é novo cliente, obrigatoriamente é novo veículo
                document.querySelector('input[name="vehicleMode"][value="new"]').checked = true;
                toggleCheckinVehicleMode();
            }
        }

        function toggleCheckinVehicleMode() {
            const mode = document.querySelector('input[name="vehicleMode"]:checked').value;
            const exVBox = document.getElementById('checkin-existing-vehicle-box');
            const newVBox = document.getElementById('checkin-new-vehicle-box');
            const kmExWrap = document.getElementById('ci-km-existing-wrapper');

            if (mode === 'existing') {
                exVBox.classList.remove('hidden');
                newVBox.classList.add('hidden');
                kmExWrap.classList.remove('hidden');
            } else {
                exVBox.classList.add('hidden');
                newVBox.classList.remove('hidden');
                kmExWrap.classList.add('hidden');
            }
        }

        function onCheckinClientSelectChange() {
            const clientId = document.getElementById('ci-client-select').value;
            const vSelect = document.getElementById('ci-vehicle-select');
            const vehicles = db.vehicles.filter(v => v.clientId === clientId);

            if (vehicles.length > 0) {
                vSelect.innerHTML = vehicles.map(v =>
                    `<option value="${v.id}">${escapeHtml(v.plate)} — ${escapeHtml(v.brandModel)} (${escapeHtml(v.year || '')})</option>`
                ).join('');
                document.querySelector('input[name="vehicleMode"][value="existing"]').checked = true;
                toggleCheckinVehicleMode();
            } else {
                vSelect.innerHTML = `<option value="">Cliente sem veículos cadastrados</option>`;
                document.querySelector('input[name="vehicleMode"][value="new"]').checked = true;
                toggleCheckinVehicleMode();
            }
        }

        function submitCheckin() {
            const clientMode = document.querySelector('input[name="clientMode"]:checked').value;
            let clientId = '';

            if (clientMode === 'existing') {
                clientId = document.getElementById('ci-client-select').value;
                if (!clientId) {
                    showToast('Selecione um cliente cadastrado ou escolha "+ Novo Cliente".', 'warning');
                    return;
                }
            } else {
                const name = document.getElementById('ci-new-name').value.trim();
                const doc = document.getElementById('ci-new-doc').value.trim();
                const phone = document.getElementById('ci-new-phone').value.trim();
                const email = document.getElementById('ci-new-email').value.trim();

                if (!name || !phone) {
                    showToast('Informe pelo menos o Nome e Telefone do novo cliente.', 'warning');
                    return;
                }

                clientId = generateId('cli');
                db.clients.push({
                    id: clientId,
                    name,
                    document: doc,
                    phone,
                    email,
                    createdAt: new Date().toISOString()
                });
            }

            const vehicleMode = document.querySelector('input[name="vehicleMode"]:checked').value;
            let vehicleId = '';
            let km = 0;

            if (vehicleMode === 'existing') {
                vehicleId = document.getElementById('ci-vehicle-select').value;
                km = parseInt(document.getElementById('ci-km-existing').value, 10);
                if (!vehicleId) {
                    showToast('Selecione um veículo válido ou cadastre um novo.', 'warning');
                    return;
                }
                if (isNaN(km) || km < 0) {
                    showToast('Informe a quilometragem (KM) atual de entrada.', 'warning');
                    return;
                }
            } else {
                const plate = document.getElementById('ci-v-plate').value.trim().toUpperCase();
                const brandModel = document.getElementById('ci-v-model').value.trim();
                const year = document.getElementById('ci-v-year').value.trim();
                const engine = document.getElementById('ci-v-engine').value.trim();
                km = parseInt(document.getElementById('ci-km').value, 10);

                if (!plate || !brandModel) {
                    showToast('Informe a Placa e Marca/Modelo do veículo.', 'warning');
                    return;
                }
                if (isNaN(km) || km < 0) {
                    showToast('Informe a quilometragem (KM) atual do veículo.', 'warning');
                    return;
                }

                vehicleId = generateId('veh');
                db.vehicles.push({
                    id: vehicleId,
                    clientId,
                    plate,
                    brandModel,
                    year,
                    engine
                });
            }

            const complaint = document.getElementById('ci-complaint').value.trim();
            if (!complaint) {
                showToast('Descreva o relato/sintoma do cliente para orientar o diagnóstico.', 'warning');
                return;
            }

            db.lastOsNumber += 1;

            const newOrder = {
                id: generateId('ord'),
                osNumber: db.lastOsNumber,
                clientId,
                vehicleId,
                stage: 'DIAGNOSTICO',
                osSubStatus: 'Aguardando Aprovação',
                createdAt: new Date().toISOString(),
                checkin: {
                    km,
                    fuel: document.getElementById('ci-fuel').value,
                    tires: document.getElementById('ci-tires').value,
                    dashLights: document.getElementById('ci-dash-lights').value.trim() || 'Nenhuma',
                    bodyDamage: document.getElementById('ci-body-damage').value.trim() || 'Sem avarias aparentes',
                    belongings: document.getElementById('ci-belongings').value.trim() || 'Padrão (estepe/macaco)',
                    complaint
                },
                diagnosis: {
                    dtcCodes: '',
                    testsPerformed: '',
                    technicalReport: '',
                    recommendedItems: '',
                    mechanicName: '',
                    diagnosedAt: null
                },
                parts: [],
                services: [],
                discountType: 'R$',
                discountValue: 0,
                checkout: null
            };

            db.orders.unshift(newOrder);
            saveDatabase();
            closeModal();
            showToast(`Check-in concluído! OS #${formatOsNumber(newOrder.osNumber)} enviada para Diagnóstico.`, 'success');
        }

        /**

         * ETAPA 2: MODAL DE DIAGNÓSTICO TÉCNICO

        function openDiagnosisModal(orderId) {

            const client = db.clients.find(c => c.id === order.clientId) || {};
            const vehicle = db.vehicles.find(v => v.id === order.vehicleId) || {};

            const bodyHtml = `
                <div class="space-y-4">

                                <span class="text-xs font-bold text-blue-400">OS #${formatOsNumber(order.osNumber)}</span>
                                <span class="bg-slate-800 px-2 py-0.5 rounded font-mono text-xs font-bold">${escapeHtml(vehicle.plate)}</span>
                                <span class="text-sm font-bold">${escapeHtml(vehicle.brandModel)}</span>
                            </div>
                            <p class="text-xs text-slate-300 mt-1">Cliente: <strong>${escapeHtml(client.name)}</strong> • Entrada: ${Number(order.checkin.km).toLocaleString('pt-BR')} km • Combustível: ${escapeHtml(order.checkin.fuel)}</p>

                    <!-- Formulário Técnico -->

                            <input type="text" id="diag-dtc" value="${escapeHtml(order.diagnosis?.dtcCodes || '')}" placeholder="Ex: P0300, P0171 - Falha de ignição cilindro 1" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm font-mono">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Mecânico / Técnico Responsável *</label>
                            <input type="text" id="diag-mechanic" value="${escapeHtml(order.diagnosis?.mechanicName || '')}" placeholder="Nome do técnico" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm">

                        <input type="text" id="diag-tests" value="${escapeHtml(order.diagnosis?.testsPerformed || '')}" placeholder="Ex: Teste de alternador 14.2V OK; Pressão bomba combustível 3.8 bar; Bobina cil. 1 sem centelha." class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Parecer Técnico Detalhado (Causa Raiz) *</label>
                        <textarea id="diag-report" rows="3" placeholder="Descreva a causa raiz identificada após inspeção..." class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm">${escapeHtml(order.diagnosis?.technicalReport || '')}</textarea>
                    </div>

                    <div>

                        <textarea id="diag-recommended" rows="2" placeholder="Ex: 1x Jogo de Velas Iridium, 1x Bobina de Ignição, Limpeza de Bicos e Mão de Obra." class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm">${escapeHtml(order.diagnosis?.recommendedItems || '')}</textarea>
                    </div>
                </div>
            `;

            const footerHtml = `
                <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold text-slate-600 hover:bg-slate-200 transition">Cancelar</button>
                <button type="button" onclick="saveDiagnosis('${order.id}', false)" class="bg-slate-700 hover:bg-slate-800 text-white px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition">
                    Salvar Rascunho
                </button>
                <button type="button" onclick="saveDiagnosis('${order.id}', true)" class="bg-amber-500 hover:bg-amber-600 text-white px-5 py-2 rounded-xl text-xs sm:text-sm font-bold shadow flex items-center gap-2 transition">
                    <i class="fa-solid fa-arrow-right"></i> Aprovar Diagnóstico & Gerar OS

                title: `Etapa 2: Diagnóstico Técnico — OS #${formatOsNumber(order.osNumber)}`,
                icon: 'fa-stethoscope',
                bodyHtml,
                footerHtml
            });
        }

        function saveDiagnosis(orderId, advanceToOs) {
            const order = db.orders.find(o => o.id === orderId);
            if (!order) return;

            const mechanicName = document.getElementById('diag-mechanic').value.trim();
            const technicalReport = document.getElementById('diag-report').value.trim();

            if (advanceToOs && (!mechanicName || !technicalReport)) {
                showToast('Preencha o Técnico Responsável e o Parecer Técnico antes de avançar para OS.', 'warning');
                return;
            }

            order.diagnosis = {
                dtcCodes: document.getElementById('diag-dtc').value.trim(),
                mechanicName,
                testsPerformed: document.getElementById('diag-tests').value.trim(),
                technicalReport,
                recommendedItems: document.getElementById('diag-recommended').value.trim(),
                diagnosedAt: new Date().toISOString()
            };

            if (advanceToOs) {
                order.stage = 'OS';
                order.osSubStatus = 'Aguardando Aprovação';
                saveDatabase();
                closeModal();
                showToast(`Diagnóstico concluído! OS #${formatOsNumber(order.osNumber)} aberta para orçamento/execução.`, 'success');
                // Abre automaticamente a OS para o usuário já lançar peças/serviços se desejar
                openOsModal(order.id);
            } else {
                saveDatabase();
                closeModal();
                showToast('Rascunho de diagnóstico salvo.', 'info');
            }
        }

        /**

         * ETAPA 3: MODAL DE ORDEM DE SERVIÇO (OS & EXECUÇÃO)
         * =====================================================================
         */
        let activeOsDraft = null;

        function openOsModal(orderId) {
            const order = db.orders.find(o => o.id === orderId);
            if (!order) return;

            activeOsDraft = JSON.parse(JSON.stringify(order));
            if (!activeOsDraft.parts) activeOsDraft.parts = [];
            if (!activeOsDraft.services) activeOsDraft.services = [];

            const client = db.clients.find(c => c.id === order.clientId) || {};
            const vehicle = db.vehicles.find(v => v.id === order.vehicleId) || {};

            const bodyHtml = `
                <div class="space-y-5">
                    <!-- Cabeçalho de Status da OS -->
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 flex flex-col md:flex-row md:items-center justify-between gap-3">
                        <div>
                            <div class="flex items-center gap-2">

                                <option value="Concluído" ${activeOsDraft.osSubStatus === 'Concluído' ? 'selected' : ''}>Concluído</option>
                            </select>

                    <!-- Resumo do Parecer Técnico -->
                    ${order.diagnosis?.technicalReport ? `

                            <div class="font-bold text-amber-900 flex items-center justify-between">
                                <span><i class="fa-solid fa-clipboard-list mr-1"></i> Laudo Técnico (${escapeHtml(order.diagnosis.mechanicName || 'Mecânico')})</span>
                                ${order.diagnosis.dtcCodes ? `<span class="font-mono bg-amber-100 px-1.5 py-0.5 rounded">DTC: ${escapeHtml(order.diagnosis.dtcCodes)}</span>` : ''}

                            <p class="text-slate-700">${escapeHtml(order.diagnosis.technicalReport)}</p>

                    <!-- Tabela Dinâmica 1: PEÇAS & INSUMOS -->

                                + Adicionar Peça

                                    <tr class="bg-slate-100 text-[11px] font-bold uppercase text-slate-600 border-b border-slate-200">

                                        <th class="py-2 px-3 w-28">Cód / Ref</th>

                <button type="button" onclick="saveOsDraft(false, true)" class="bg-slate-100 hover:bg-slate-200 text-slate-800 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-1.5 transition mr-auto">

                </button>
                <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold text-slate-600 hover:bg-slate-200 transition">Fechar</button>

                    Salvar OS
                </button>
                <button type="button" onclick="saveOsDraft(true, false)" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs sm:text-sm font-bold shadow flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-flag-checkered"></i> Concluir Serviço p/ Check-out
                </button>
            `;

            openModal({
                title: `Etapa 3: Ordem de Serviço #${formatOsNumber(order.osNumber)}`,
                icon: 'fa-file-invoice-dollar',
                bodyHtml,
                footerHtml,
                maxWidth: 'max-w-5xl'
            });

            renderOsTables();
        }

        function renderOsTables() {
            const partsTbody = document.getElementById('os-parts-tbody');
            const servicesTbody = document.getElementById('os-services-tbody');

            if (activeOsDraft.parts.length === 0) {
                partsTbody.innerHTML = `<tr><td colspan="6" class="py-4 text-center text-slate-400">Nenhuma peça adicionada. Clique em "+ Adicionar Peça".</td></tr>`;
            } else {
                partsTbody.innerHTML = activeOsDraft.parts.map((p, idx) => {
                    const sub = (parseFloat(p.qty) || 0) * (parseFloat(p.unitPrice) || 0);
                    return `
                        <tr>
                            <td class="p-2"><input type="text" value="${escapeHtml(p.desc)}" onchange="updateOsItem('parts', ${idx}, 'desc', this.value)" placeholder="Ex: Filtro de Óleo" class="w-full border border-slate-200 rounded-lg px-2 py-1"></td>
                            <td class="p-2"><input type="text" value="${escapeHtml(p.code || '')}" onchange="updateOsItem('parts', ${idx}, 'code', this.value)" placeholder="REF-01" class="w-full border border-slate-200 rounded-lg px-2 py-1 font-mono"></td>
                            <td class="p-2"><input type="number" value="${p.qty}" min="1" step="1" onchange="updateOsItem('parts', ${idx}, 'qty', this.value)" class="w-full border border-slate-200 rounded-lg px-2 py-1 text-center"></td>
                            <td class="p-2"><input type="number" value="${p.unitPrice}" min="0" step="0.01" onchange="updateOsItem('parts', ${idx}, 'unitPrice', this.value)" class="w-full border border-slate-200 rounded-lg px-2 py-1 text-right"></td>
                            <td class="p-2 text-right font-bold text-slate-800">${formatCurrency(sub)}</td>
                            <td class="p-2 text-center"><button type="button" onclick="removeOsItem('parts', ${idx})" class="text-rose-500 hover:text-rose-700"><i class="fa-solid fa-trash"></i></button></td>
                        </tr>
                    `;
                }).join('');
            }

            if (activeOsDraft.services.length === 0) {
                servicesTbody.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-slate-400">Nenhum serviço adicionado. Clique em "+ Adicionar Serviço".</td></tr>`;
            } else {
                servicesTbody.innerHTML = activeOsDraft.services.map((s, idx) => {
                    const sub = (parseFloat(s.qty) || 0) * (parseFloat(s.unitPrice) || 0);
                    return `
                        <tr>
                            <td class="p-2"><input type="text" value="${escapeHtml(s.desc)}" onchange="updateOsItem('services', ${idx}, 'desc', this.value)" placeholder="Ex: Troca de óleo e filtros" class="w-full border border-slate-200 rounded-lg px-2 py-1"></td>
                            <td class="p-2"><input type="number" value="${s.qty}" min="0.5" step="0.5" onchange="updateOsItem('services', ${idx}, 'qty', this.value)" class="w-full border border-slate-200 rounded-lg px-2 py-1 text-center"></td>
                            <td class="p-2"><input type="number" value="${s.unitPrice}" min="0" step="0.01" onchange="updateOsItem('services', ${idx}, 'unitPrice', this.value)" class="w-full border border-slate-200 rounded-lg px-2 py-1 text-right"></td>
                            <td class="p-2 text-right font-bold text-slate-800">${formatCurrency(sub)}</td>
                            <td class="p-2 text-center"><button type="button" onclick="removeOsItem('services', ${idx})" class="text-rose-500 hover:text-rose-700"><i class="fa-solid fa-trash"></i></button></td>
                        </tr>
                    `;
                }).join('');
            }

            renderOsSummaryBox();
        }

        function addOsItem(type) {
            if (type === 'parts') {
                activeOsDraft.parts.push({ desc: '', code: '', qty: 1, unitPrice: 0 });
            } else {
                activeOsDraft.services.push({ desc: '', qty: 1, unitPrice: 0 });
            }
            renderOsTables();
        }

        function updateOsItem(type, index, field, value) {
            if (field === 'qty' || field === 'unitPrice') {
                activeOsDraft[type][index][field] = parseFloat(value) || 0;
            } else {
                activeOsDraft[type][index][field] = value;
            }
            renderOsTables();
        }

        function removeOsItem(type, index) {
            activeOsDraft[type].splice(index, 1);
            renderOsTables();
        }

        function updateOsDiscount() {
            activeOsDraft.discountType = document.getElementById('os-discount-type').value;
            activeOsDraft.discountValue = parseFloat(document.getElementById('os-discount-val').value) || 0;
            renderOsSummaryBox();
        }

        function renderOsSummaryBox() {
            const totals = calculateOrderTotals(activeOsDraft);
            document.getElementById('os-totals-summary').innerHTML = `
                <div class="text-slate-300">Peças: <strong>${formatCurrency(totals.partsTotal)}</strong> | Serviços: <strong>${formatCurrency(totals.servicesTotal)}</strong></div>
                <div class="text-slate-400">Subtotal: ${formatCurrency(totals.subtotal)} | Desconto: -${formatCurrency(totals.discountAmount)}</div>
                <div class="text-base sm:text-lg font-extrabold text-emerald-400 pt-0.5">TOTAL DA OS: ${formatCurrency(totals.grandTotal)}</div>
            `;
        }

        function saveOsDraft(advanceToCheckout, triggerPrint) {
            const idx = db.orders.findIndex(o => o.id === activeOsDraft.id);
            if (idx === -1) return;

            // Filtra linhas totalmente vazias
            activeOsDraft.parts = activeOsDraft.parts.filter(p => p.desc.trim() !== '');
            activeOsDraft.services = activeOsDraft.services.filter(s => s.desc.trim() !== '');

            if (advanceToCheckout) {
                if (activeOsDraft.parts.length === 0 && activeOsDraft.services.length === 0) {
                    showToast('Adicione pelo menos uma peça ou serviço antes de concluir a OS.', 'warning');
                    return;
                }
                activeOsDraft.osSubStatus = 'Concluído';
                activeOsDraft.stage = 'CHECKOUT';
            }

            db.orders[idx] = activeOsDraft;
            saveDatabase();

            if (triggerPrint) {
                printDocument(activeOsDraft.id, 'OS');
                return;
            }

            closeModal();
            if (advanceToCheckout) {
                showToast(`OS #${formatOsNumber(activeOsDraft.osNumber)} concluída e enviada para Check-out!`, 'success');
            } else {
                showToast(`OS #${formatOsNumber(activeOsDraft.osNumber)} atualizada com sucesso.`, 'success');
            }
        }

        /**
         * =====================================================================
         * ETAPA 4: MODAL DE CHECK-OUT (ENTREGA, GARANTIA & FATURAMENTO)
         * =====================================================================
         */
        function openCheckoutModal(orderId) {
            const order = db.orders.find(o => o.id === orderId);
            if (!order) return;
            const client = db.clients.find(c => c.id === order.clientId) || {};
            const vehicle = db.vehicles.find(v => v.id === order.vehicleId) || {};
            const totals = calculateOrderTotals(order);

            const bodyHtml = `
                <div class="space-y-5">
                    <!-- Resumo Financeiro e do Veículo -->
                    <div class="bg-slate-900 text-white p-4 rounded-xl flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        <div>
                            <span class="text-xs font-bold text-purple-400">CHECK-OUT — OS #${formatOsNumber(order.osNumber)}</span>
                            <h3 class="text-base font-bold mt-0.5">${escapeHtml(vehicle.plate)} — ${escapeHtml(vehicle.brandModel)}</h3>
                            <p class="text-xs text-slate-300">Cliente: ${escapeHtml(client.name)} • KM Entrada: ${Number(order.checkin.km).toLocaleString('pt-BR')} km</p>
                        </div>
                        <div class="bg-slate-800 px-4 py-2.5 rounded-xl border border-slate-700 text-right">
                            <span class="text-[11px] uppercase text-slate-400 block">Valor Final a Receber</span>
                            <span class="text-xl font-extrabold text-emerald-400">${formatCurrency(totals.grandTotal)}</span>
                        </div>
                    </div>

                    <!-- Conferência Final de Entrega -->
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                        <h4 class="text-sm font-bold text-slate-800">Conferência Técnica de Saída & Garantia</h4>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Quilometragem de Saída (KM) *</label>
                                <input type="number" id="co-km-out" value="${order.checkin.km}" min="${order.checkin.km}" class="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-sm font-bold">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Termo de Garantia (Dias / KM)</label>
                                <input type="text" id="co-warranty" value="90 dias ou 5.000 km (o que ocorrer primeiro)" class="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-sm">
                            </div>
                        </div>

                        <div class="flex flex-col sm:flex-row gap-4 pt-1">
                            <label class="flex items-center gap-2 text-xs font-semibold text-slate-700 cursor-pointer">
                                <input type="checkbox" id="co-road-test" checked class="w-4 h-4 rounded text-blue-600">
                                Teste de rodagem / qualidade realizado
                            </label>
                            <label class="flex items-center gap-2 text-xs font-semibold text-slate-700 cursor-pointer">
                                <input type="checkbox" id="co-old-parts" checked class="w-4 h-4 rounded text-blue-600">
                                Peças substituídas devolvidas ao cliente
                            </label>
                        </div>
                    </div>

                    <!-- Faturamento / Pagamento -->
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                        <h4 class="text-sm font-bold text-slate-800">Faturamento & Recebimento</h4>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Forma de Pagamento</label>
                                <select id="co-payment-method" class="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-sm font-semibold">
                                    <option value="PIX">PIX Instantâneo</option>
                                    <option value="Cartão de Crédito">Cartão de Crédito</option>
                                    <option value="Cartão de Débito">Cartão de Débito</option>
                                    <option value="Dinheiro">Dinheiro</option>
                                    <option value="Faturado / Boleto">Faturado / Boleto</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Status do Pagamento</label>
                                <select id="co-payment-status" class="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-sm font-bold">
                                    <option value="Pago">Pago (Quitado no ato)</option>
                                    <option value="Pendente">Pendente (A receber)</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Observações Finais / Recomendações Próxima Revisão</label>
                            <input type="text" id="co-notes" placeholder="Ex: Retornar em 10.000 km para troca de óleo e revisão de freios." class="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-sm">
                        </div>
                    </div>
                </div>
            `;

            const footerHtml = `
                <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold text-slate-600 hover:bg-slate-200 transition">Cancelar</button>
                <button type="button" onclick="submitCheckout('${order.id}', false)" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-xl text-xs sm:text-sm font-bold shadow transition">
                    Finalizar Entrega
                </button>
                <button type="button" onclick="submitCheckout('${order.id}', true)" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2 rounded-xl text-xs sm:text-sm font-bold shadow flex items-center gap-2 transition">
                    <i class="fa-solid fa-print"></i> Finalizar & Imprimir Recibo de Garantia
                </button>

            openModal({
                title: `Etapa 4: Check-out & Entrega — OS #${formatOsNumber(order.osNumber)}`,
                icon: 'fa-flag-checkered',
                bodyHtml,
                footerHtml
            });
        }

        function submitCheckout(orderId, shouldPrintReceipt) {
            const order = db.orders.find(o => o.id === orderId);
            if (!order) return;

            const kmOut = parseInt(document.getElementById('co-km-out').value, 10);
            if (isNaN(kmOut) || kmOut < order.checkin.km) {
                showToast('A KM de saída deve ser maior ou igual à KM de entrada.', 'warning');
                return;
            }

            order.checkout = {
                kmOut,
                warranty: document.getElementById('co-warranty').value.trim(),
                roadTest: document.getElementById('co-road-test').checked,
                oldPartsReturned: document.getElementById('co-old-parts').checked,
                paymentMethod: document.getElementById('co-payment-method').value,
                paymentStatus: document.getElementById('co-payment-status').value,
                notes: document.getElementById('co-notes').value.trim(),
                completedAt: new Date().toISOString()
            };

            order.stage = 'CONCLUIDO';
            saveDatabase();
            closeModal();
            showToast(`Check-out da OS #${formatOsNumber(order.osNumber)} finalizado com sucesso!`, 'success');

            if (shouldPrintReceipt) {
                printDocument(order.id, 'CHECKOUT');
            }
        }

        /**
         * =====================================================================
         * IMPRESSÃO FORMATADA A4 (@media print) — OS E RECIBO DE CHECK-OUT
         * =====================================================================
         */
        function printDocument(orderId, docType) {
            const order = db.orders.find(o => o.id === orderId);
            if (!order) return;

            const client = db.clients.find(c => c.id === order.clientId) || {};
            const vehicle = db.vehicles.find(v => v.id === order.vehicleId) || {};
            const totals = calculateOrderTotals(order);
            const ws = db.workshop;
            const isCheckout = docType === 'CHECKOUT';

            const docTitle = isCheckout
                ? `COMPROVANTE DE ENTREGA, GARANTIA E RECIBO — OS #${formatOsNumber(order.osNumber)}`
                : `ORDEM DE SERVIÇO AUTOMOTIVA — OS #${formatOsNumber(order.osNumber)}`;

            const partsRows = (order.parts || []).map((p, i) => `
                <tr>
                    <td>${i + 1}</td>
                    <td>${escapeHtml(p.desc)}</td>
                    <td>${escapeHtml(p.code || '-')}</td>
                    <td style="text-align:center;">${p.qty}</td>
                    <td style="text-align:right;">${formatCurrency(p.unitPrice)}</td>
                    <td style="text-align:right; font-weight:bold;">${formatCurrency(p.qty * p.unitPrice)}</td>
                </tr>
            `).join('') || `<tr><td colspan="6" style="text-align:center; color:#64748b;">Nenhuma peça lançada nesta OS.</td></tr>`;

            const servicesRows = (order.services || []).map((s, i) => `
                <tr>
                    <td>${i + 1}</td>
                    <td>${escapeHtml(s.desc)}</td>
                    <td style="text-align:center;">${s.qty}</td>
                    <td style="text-align:right;">${formatCurrency(s.unitPrice)}</td>
                    <td style="text-align:right; font-weight:bold;">${formatCurrency(s.qty * s.unitPrice)}</td>
                </tr>
            `).join('') || `<tr><td colspan="5" style="text-align:center; color:#64748b;">Nenhum serviço lançado nesta OS.</td></tr>`;

            const printArea = document.getElementById('print-container');
            printArea.innerHTML = `
                <div style="font-family: 'Inter', Arial, sans-serif; color: #0f172a;">
                    <!-- Cabeçalho da Oficina -->
                    <div class="print-box" style="display:flex; justify-content:space-between; align-items:center; background:#f8fafc;">
                        <div>

        /**
         * Exportação e Importação JSON (Backup)
         */
        function exportDatabaseJson() {
            const dataStr = JSON.stringify(db, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const dateTag = new Date().toISOString().slice(0, 10);
            a.href = url;
            a.download = `backup_oficina_autotech_${dateTag}.json`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
            showToast('Backup JSON exportado com sucesso!', 'success');
        }

        function importDatabaseJson(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (!imported.clients || !imported.vehicles || !imported.orders) {
                        throw new Error('Estrutura de arquivo inválida.');
                    }
                    db = imported;
                    updateHeaderWorkshop();
                    saveDatabase();
                    showToast('Banco de dados restaurado com sucesso!', 'success');
                } catch (err) {
                    showToast('Arquivo JSON inválido ou corrompido.', 'error');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }
